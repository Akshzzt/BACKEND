{% extends 'todo/base.html' %}

{% block title %}Add Task — Django App{% endblock %}

{% block content %}
  <div class="page-header">
    <h1>Add a New Task</h1>
    <a class="btn btn-secondary" href="{% url 'task_list' %}">&larr; Back to List</a>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="taskTitle">Task Title</label>
      <input id="taskTitle" type="text" name="title" class="form-control" placeholder="Enter task title..." maxlength="200" required autofocus>
    </div>
    <button type="submit" class="btn">Add Task</button>
  </form>
{% endblock %}
