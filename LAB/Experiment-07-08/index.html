<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ES6 To-Do App — Experiment 07 &amp; 08</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
    }
    .app {
      max-width: 580px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .nav-link {
      font-size: 0.88rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .nav-link:hover { text-decoration: underline; }
    .input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    input {
      flex: 1;
      padding: 0.6rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    button {
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.92; }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      padding: 0.7rem 0.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
    }
    li span { flex: 1; }
    .done {
      text-decoration: line-through;
      color: var(--muted);
    }
    .delete-btn {
      background: var(--danger);
      padding: 0.35rem 0.7rem;
      font-size: 0.82rem;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 1.25rem 0;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="top-bar">
      <h1>My To-Do List</h1>
      <a class="nav-link" href="dom-events-demo.html">DOM &amp; Events Playground →</a>
    </div>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Enter a task...">
      <button id="addBtn" type="button">Add</button>
    </div>

    <div class="meta">
      <span id="taskStats">0 tasks</span>
      <span>Click a task to toggle complete</span>
    </div>

    <ul id="taskList"></ul>
    <p id="emptyState" class="empty">No tasks yet. Add one above!</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
