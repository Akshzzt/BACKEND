
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 32px;
            color: #4338ca;
            margin-bottom: 8px;
        }

        header p {
            color: #64748b;
        }

        .note-form {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
            margin-bottom: 25px;
        }

        input, textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input:focus, textarea:focus {
            outline: 2px solid #818cf8;
            border-color: #6366f1;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .add-btn {
            background: #4f46e5;
            color: white;
        }

        .add-btn:hover {
            background: #3730a3;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .notes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .notes-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 18px;
        }

        .note-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000010;
            border-top: 4px solid #6366f1;
            overflow-wrap: anywhere;
        }

        .note-card h3 {
            margin-bottom: 10px;
        }

        .note-card p {
            color: #475569;
            white-space: pre-wrap;
            margin-bottom: 15px;
        }

        .note-card.completed {
            opacity: 0.65;
            border-top-color: #16a34a;
        }

        .note-card.completed h3,
        .note-card.completed p {
            text-decoration: line-through;
        }

        .note-date {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .edit-btn {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        .complete-btn {
            background: #dcfce7;
            color: #15803d;
        }

        .empty {
            text-align: center;
            color: #94a3b8;
            padding: 35px;
            grid-column: 1 / -1;
        }

        @media (max-width: 500px) {
            header h1 {
                font-size: 26px;
            }

            .notes-header {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>My Notes App</h1>
            <p>Save your thoughts, tasks and important ideas.</p>
        </header>

        <section class="note-form">

            <h2 id="formHeading">Create a New Note</h2>
            <br>

            <input
                type="text"
                id="noteTitle"
                placeholder="Enter note title"
            >

            <textarea
                id="noteInput"
                placeholder="Write your note here..."
            ></textarea>

            <button class="add-btn" id="saveBtn" onclick="handleSave()">
                Add Note
            </button>

            <button id="cancelBtn" onclick="cancelEdit()" hidden>
                Cancel
            </button>

        </section>

        <input
            type="text"
            class="search-box"
            id="searchInput"
            placeholder="Search your notes..."
            oninput="renderNotes()"
        >

        <div class="notes-header">
            <h2>My Notes</h2>
            <span id="noteCount">0 Notes</span>
        </div>

        <div class="notes-list" id="notesList"></div>

    </div>

    <script>

        const STORAGE_KEY = "notes";

        let editingId = null;

        // GET NOTES FROM LOCAL STORAGE
        function getNotes() {
            const raw = localStorage.getItem(STORAGE_KEY);

            if (!raw) return [];

            try {
                const notes = JSON.parse(raw);
                return Array.isArray(notes) ? notes : [];
            } catch (error) {
                console.error("Unable to read saved notes:", error);
                return [];
            }
        }

        // SAVE NOTES TO LOCAL STORAGE
        function saveNotes(notes) {
            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(notes)
            );
        }

        // ADD OR UPDATE NOTE
        function handleSave() {

            const title = document.getElementById("noteTitle").value.trim();
            const text = document.getElementById("noteInput").value.trim();

            if (!title || !text) {
                alert("Please enter both title and note text!");
                return;
            }

            const notes = getNotes();
            const now = new Date().toISOString();

            if (editingId !== null) {

                const note = notes.find(n => n.id === editingId);

                if (note) {
                    note.title = title;
                    note.text = text;
                    note.updatedAt = now;
                }

                editingId = null;

            } else {

                const newNote = {
                    id: Date.now() + Math.random(),
                    title: title,
                    text: text,
                    completed: false,
                    createdAt: now,
                    updatedAt: null
                };

                notes.push(newNote);
            }

            saveNotes(notes);
            clearForm();
            renderNotes();
        }

        // DISPLAY NOTES
        function renderNotes() {

            const container = document.getElementById("notesList");
            const search = document.getElementById("searchInput")
                .value.toLowerCase();

            const notes = getNotes();

            const filteredNotes = notes.filter(note =>
                (note.title || "").toLowerCase().includes(search) ||
                (note.text || "").toLowerCase().includes(search)
            );

            document.getElementById("noteCount").textContent =
                `${notes.length} Notes`;

            container.innerHTML = "";

            if (filteredNotes.length === 0) {
                const empty = document.createElement("div");
                empty.className = "empty";
                empty.textContent = notes.length === 0
                    ? "No notes yet. Create your first note!"
                    : "No matching notes found.";

                container.appendChild(empty);
                return;
            }

            filteredNotes.forEach(note => {

                const card = document.createElement("div");
                card.className = "note-card";

                if (note.completed) {
                    card.classList.add("completed");
                }

                const title = document.createElement("h3");
                title.textContent = note.title;

                const content = document.createElement("p");
                content.textContent = note.text;

                const date = document.createElement("div");
                date.className = "note-date";

                date.textContent = "Created: " +
                    new Date(note.createdAt).toLocaleString();

                if (note.updatedAt) {
                    date.textContent += " | Updated: " +
                        new Date(note.updatedAt).toLocaleString();
                }

                const actions = document.createElement("div");
                actions.className = "actions";

                const editBtn = document.createElement("button");
                editBtn.className = "edit-btn";
                editBtn.textContent = "Edit";
                editBtn.onclick = () => editNote(note.id);

                const deleteBtn = document.createElement("button");
                deleteBtn.className = "delete-btn";
                deleteBtn.textContent = "Delete";
                deleteBtn.onclick = () => deleteNote(note.id);

                const completeBtn = document.createElement("button");
                completeBtn.className = "complete-btn";
                completeBtn.textContent = note.completed
                    ? "Undo"
                    : "Complete";
                completeBtn.onclick = () => toggleComplete(note.id);

                actions.append(editBtn, deleteBtn, completeBtn);

                card.append(title, content, date, actions);
                container.appendChild(card);
            });
        }

        // EDIT NOTE
        function editNote(id) {

            const note = getNotes().find(n => n.id === id);

            if (!note) return;

            document.getElementById("noteTitle").value = note.title;
            document.getElementById("noteInput").value = note.text;

            editingId = id;

            document.getElementById("formHeading").textContent =
                "Edit Your Note";

            document.getElementById("saveBtn").textContent =
                "Update Note";

            document.getElementById("cancelBtn").hidden = false;

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        // DELETE NOTE
        function deleteNote(id) {

            if (!confirm("Are you sure you want to delete this note?")) {
                return;
            }

            const notes = getNotes().filter(n => n.id !== id);

            saveNotes(notes);

            if (editingId === id) {
                cancelEdit();
            }

            renderNotes();
        }

        // MARK COMPLETE OR INCOMPLETE
        function toggleComplete(id) {

            const notes = getNotes();
            const note = notes.find(n => n.id === id);

            if (!note) return;

            note.completed = !note.completed;
            note.updatedAt = new Date().toISOString();

            saveNotes(notes);
            renderNotes();
        }

        // CLEAR FORM
        function clearForm() {

            document.getElementById("noteTitle").value = "";
            document.getElementById("noteInput").value = "";

            document.getElementById("formHeading").textContent =
                "Create a New Note";

            document.getElementById("saveBtn").textContent =
                "Add Note";

            document.getElementById("cancelBtn").hidden = true;

            editingId = null;
        }

        // CANCEL EDITING
        function cancelEdit() {
            clearForm();
        }

        // LOAD NOTES WHEN PAGE OPENS
        window.onload = function() {
            renderNotes();
        };

    </script>

</body>
</html>
