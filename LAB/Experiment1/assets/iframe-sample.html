<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Embedded Iframe Document</title>
  <style>
    body {
      margin: 0;
      padding: 1rem 1.25rem;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.5;
    }
    h3 { margin: 0 0 0.4rem; color: #38bdf8; font-size: 1rem; }
    p { margin: 0; font-size: 0.9rem; color: #cbd5e1; }
    code { background: #1e293b; padding: 0.1rem 0.35rem; border-radius: 4px; color: #f472b6; }
  </style>
</head>
<body>
  <h3>Inside <code>&lt;iframe&gt;</code></h3>
  <p>This nested browsing context is rendered from <code>assets/iframe-sample.html</code> using standard HTML5 sandboxing.</p>
</body>
</html>
